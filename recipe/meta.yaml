{% set name = "LoProp" %}
{% set version = "0.3.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6dc92bebf1bb1d8f3cc92f637bb6200a0e17a5d030b93dea9bd479fe8259d103

build:
  number: 1
  noarch: python
  entry_points:
    - loprop=loprop.__main__:main
  script: {{ PYTHON }} -m pip install .[dalton,vlx] -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - blocked-matrix-utils
    - daltools
    - h5py
    - numpy
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - loprop
  commands:
    - loprop --help

about:
  home: https://github.com/vahtras/loprop
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Localized properties

extra:
  recipe-maintainers:
    - vahtras
    - robertodr
